<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Publicações do Laboratório</title>
<style>
:root{--bg:#fff;--fg:#1c1f24;--mut:#667085;--card:#f5f7fa;--bd:#d9dee5;--ac:#1b5fd1}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8ebf0;--mut:#98a2b3;--card:#1d2229;--bd:#323a45;--ac:#6ea3ff}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:24px;max-width:1000px;margin-inline:auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:32px 0 8px}h3{font-size:16px;margin:0}
.mut{color:var(--mut);font-size:13px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin:12px 0}
.tot{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.tot div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 16px}
.tot b{display:block;font-size:22px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.wrap{overflow-x:auto}
a{color:var(--ac)}.warn{color:#b54708;font-size:13px}
</style>
</head>
<body>
<h1>Painel de Publicações do Laboratório</h1>
<p class="mut">Nomes: aba “Página1” da planilha. Publicações: OpenAlex (automático) + aba “Publicações” da planilha (registro manual, para o que o OpenAlex não indexa, como congressos nacionais).</p>
<button id="go">Atualizar levantamento</button> <button id="csv" disabled>Exportar CSV</button>
<span id="st" class="mut"></span>

<div id="ind"></div>
<h2>Registro geral do laboratório</h2>
<div id="geral" class="mut">Clique em “Atualizar levantamento”.</div>

<script>
// ===== CONFIGURAÇÃO (edite apenas aqui) =====
const CONFIG = {
  SHEET_ID: "1Fa7hXe-Zt5CYW7AzjRCpQ0UGx7e2p3n-TzpV1etQgas", // ID da planilha (compartilhada como "Qualquer pessoa com o link")
  ABA_PESSOAS_GID: "0",          // gid da aba com os nomes (Página1)
  ABA_PUBLICACOES: "Publicações", // nome da aba de registro manual (opcional)
  EMAIL: "felipefurlaneto01@gmail.com" // opcional, melhora a fila de requisições do OpenAlex
};
// ============================================
const $=id=>document.getElementById(id);
const API="https://api.openalex.org";
const GV=`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv`;
const mail=CONFIG.EMAIL?`&mailto=${encodeURIComponent(CONFIG.EMAIL)}`:"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const normTitle=s=>norm(s).replace(/[^a-z0-9]+/g," ").trim();
const normDoi=s=>norm(s).replace(/^https?:\/\/(dx\.)?doi\.org\//,"");
const keyOf=w=>{const d=w.doi&&normDoi(w.doi);return d&&d.startsWith("10.")?"d:"+d:"t:"+normTitle(w.titulo)};
let rows=[];

function parseCSV(t){
  const out=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"){r.push(c);out.push(r);r=[];c=""}
    else if(ch!="\r")c+=ch}
  if(c||r.length){r.push(c);out.push(r)}
  return out;
}
async function getJSON(u){
  try{const r=await fetch(u);if(!r.ok)return null;return await r.json()}catch(e){return null}
}

async function loadPeople(){
  const res=await fetch(`${GV}&gid=${CONFIG.ABA_PESSOAS_GID}`);
  if(!res.ok)throw new Error("Erro HTTP "+res.status+" ao ler a planilha.");
  const txt=await res.text();
  const t=parseCSV(txt);
  
  // Lê o cabeçalho na linha 5 (índice 4)
  const h=(t[4]||[]).map(norm);
  const col=k=>h.findIndex(x=>x.includes(k));
  
  // Busca as colunas exatas da sua planilha
  const iN=col("nome como publicado"),iL=col("nivel"),iA=col("ano de ingresso"),iO=col("orcid"),iG=col("academico");
  
  if(iN<0||iA<0)throw new Error("Link não devolveu CSV ou cabeçalho não encontrado. Verifique os nomes das colunas.");
  
  // Lê os dados a partir da linha 6 (índice 5)
  const ppl=t.slice(5).filter(r=>r[iN]&&r[iN].trim()).map(r=>({
    nome:r[iN].trim(),
    nivel:(r[iL]||"").trim(),
    ano:parseInt(r[iA])||1900,
    orcid:iO>=0?(r[iO]||"").trim():"",
    scholar:iG>=0?(r[iG]||"").trim():""
  }));
  
  if(!ppl.length)throw new Error("Planilha lida, mas sem linhas de pessoas.");
  return ppl;
}

function tipoManual(s){
  const n=norm(s);
  if(/congress|evento|simpos|conferenc|anais|proceeding|encontro/.test(n))return"proceedings-article";
  if(/revista|period|journal|artigo/.test(n))return"article";
  if(/capitulo/.test(n))return"book-chapter";
  if(/livro/.test(n))return"book";
  if(/preprint/.test(n))return"preprint";
  if(/tese|dissert/.test(n))return"dissertation";
  return s||"outro";
}

async function loadManual(){
  try{
    const res=await fetch(`${GV}&sheet=${encodeURIComponent(CONFIG.ABA_PUBLICACOES)}`);
    if(!res.ok)return[];
    const t=parseCSV(await res.text());
    const h=(t[0]||[]).map(norm);
    const col=(...ks)=>h.findIndex(x=>ks.some(k=>x.includes(k)));
    const iP=col("pessoa","nome"),iT=col("titulo"),iA=col("ano"),iTp=col("tipo"),iV=col("veiculo","revista","congresso"),iL=col("link","doi");
    if(iP<0||iT<0)return[]; // aba inexistente ou com outro formato
    return t.slice(1).filter(r=>r[iP]&&r[iT]&&r[iT].trim()).map(r=>({
      pessoa:norm(r[iP]),titulo:r[iT].trim(),ano:parseInt(r[iA])||0,
      tipo:tipoManual(iTp>=0?r[iTp]:""),veiculo:(iV>=0&&r[iV]||"").trim()||"—",
      doi:(iL>=0&&r[iL]||"").trim(),fonte:"Manual"}));
  }catch(e){return[]}
}

async function findAuthor(p){
  if(p.orcid){
    const id=p.orcid.replace(/^https?:\/\/orcid.org\//,"");
    const r=await getJSON(`${API}/authors/orcid:${id}?select=id,display_name${mail}`);
    if(r&&r.id)return{id:r.id.split("/").pop(),nome:r.display_name,exato:true};
  }
  const r=await getJSON(`${API}/authors?search=${encodeURIComponent(p.nome)}&per-page=1${mail}`);
  const a=r&&r.results&&r.results[0];
  return a?{id:a.id.split("/").pop(),nome:a.display_name,exato:false}:null;
}

async function findWorks(aid,ano){
  let page=1,all=[];
  while(page<=5){
    // CORREÇÃO: Agora usa o ID do autor (aid) em vez do nome, evitando homônimos e erros.
    const u = `${API}/works?filter=author.id:${aid},from_publication_date:${ano}-01-01` +
  `&select=id,doi,title,publication_year,type,primary_location&per-page=100&page=${page}${mail}`;
    const r=await getJSON(u);
    if(!r||!r.results)break;
    all=all.concat(r.results);
    if(r.results.length<100)break;page++;
  }
  return all.map(w=>({id:w.id,doi:w.doi||"",titulo:w.title||"(sem título)",ano:w.publication_year,
    tipo:w.type,fonte:"OpenAlex",
    veiculo:(w.primary_location&&w.primary_location.source&&w.primary_location.source.display_name)||"—"}));
}

const tipoPT=t=>({article:"Periódico","proceedings-article":"Congresso",book:"Livro","book-chapter":"Capítulo",preprint:"Preprint",dissertation:"Tese/Dissertação"}[t]||t||"Outro");
const link=w=>w.doi?`<a href="${esc(/^http/.test(w.doi)?w.doi:"https://doi.org/"+w.doi)}" target="_blank" rel="noopener">${esc(w.titulo)}</a>`:esc(w.titulo);

function renderPerson(p,a,ws,nManual){
  const porTipo={};ws.forEach(w=>{const k=tipoPT(w.tipo);porTipo[k]=(porTipo[k]||0)+1});
  const resumo=Object.entries(porTipo).map(([k,v])=>`${k}: ${v}`).join(" · ")||"sem registros";
  const aviso=!a?`<p class="warn">Autor não encontrado no OpenAlex (use a aba “Publicações” para registrar manualmente).</p>`:
    a.exato?"":`<p class="warn">Correspondência por nome (“${esc(a.nome)}”). Para evitar homônimos, preencha o ORCID na planilha.</p>`;
  const sch=/^https?:/.test(p.scholar)?` · <a href="${esc(p.scholar)}" target="_blank" rel="noopener">Google Acadêmico</a>`:"";
  return `<div class="card"><h3>${esc(p.nome)}</h3>
  <div class="mut">${esc(p.nivel)} · ingresso em ${p.ano} · <b>${ws.length}</b> publicações desde o ingresso (${resumo})${sch}</div>${aviso}
  <div class="wrap"><table><tr><th>Ano</th><th>Título</th><th>Tipo</th><th>Revista / Congresso</th><th>Fonte</th></tr>
  ${ws.sort((x,y)=>y.ano-x.ano).map(w=>`<tr><td>${w.ano||"—"}</td><td>${link(w)}</td><td>${tipoPT(w.tipo)}</td><td>${esc(w.veiculo)}</td><td>${w.fonte}</td></tr>`).join("")}
  </table></div></div>`;
}

function renderGeral(map){
  const L=[...map.values()].sort((a,b)=>b.ano-a.ano);
  const porTipo={},porAno={},porVeic={};
  L.forEach(w=>{const k=tipoPT(w.tipo);porTipo[k]=(porTipo[k]||0)+1;porAno[w.ano]=(porAno[w.ano]||0)+1;porVeic[w.veiculo]=(porVeic[w.veiculo]||0)+1});
  const tops=Object.entries(porVeic).sort((a,b)=>b[1]-a[1]).slice(0,15);
  $("geral").className="";
  $("geral").innerHTML=`<div class="tot"><div><b>${L.length}</b>publicações únicas</div>
  ${Object.entries(porTipo).map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join("")}</div>
  <div class="mut">Por ano: ${Object.entries(porAno).sort().reverse().map(([k,v])=>`${k} (${v})`).join(" · ")}</div>
  <h3 style="margin-top:16px">Principais veículos</h3>
  <div class="wrap"><table><tr><th>Revista / Congresso</th><th>Nº</th></tr>${tops.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")}</table></div>
  <h3 style="margin-top:16px">Todas as publicações</h3>
  <div class="wrap"><table><tr><th>Ano</th><th>Título</th><th>Tipo</th><th>Veículo</th><th>Autores do lab</th></tr>
  ${L.map(w=>`<tr><td>${w.ano||"—"}</td><td>${link(w)}</td><td>${tipoPT(w.tipo)}</td><td>${esc(w.veiculo)}</td><td>${esc(w.autores.join("; "))}</td></tr>`).join("")}</table></div>`;
}

$("go").onclick=async()=>{
  $("go").disabled=true;$("ind").innerHTML="";rows=[];
  try{
    $("st").textContent=" Lendo planilha…";
    const [people,manual]=await Promise.all([loadPeople(),loadManual()]);
    const geral=new Map();
    for(let i=0;i<people.length;i++){
      const p=people[i];$("st").textContent=` Buscando ${i+1}/${people.length}: ${p.nome}`;
      let a=null,auto=[];
      try{a=await findAuthor(p);if(a)auto=await findWorks(a.id,p.ano)}catch(e){console.error(e)}
      // junta automático + manual, sem duplicar (DOI ou título)
      const seen=new Set(),ws=[];
      const man=manual.filter(m=>m.pessoa===norm(p.nome)&&(!m.ano||m.ano>=p.ano));
      [...auto,...man].forEach(w=>{const k=keyOf(w);if(seen.has(k))return;seen.add(k);ws.push(w)});
      $("ind").insertAdjacentHTML("beforeend",renderPerson(p,a,ws,man.length));
      ws.forEach(w=>{
        const k=keyOf(w);
        if(!geral.has(k))geral.set(k,{...w,autores:[]});
        geral.get(k).autores.push(p.nome);
        rows.push([p.nome,p.nivel,p.ano,w.ano,w.titulo,tipoPT(w.tipo),w.veiculo,w.doi||"",w.fonte]);
      });
    }
    renderGeral(geral);
    $("st").textContent=" Concluído em "+new Date().toLocaleString("pt-BR")+` (${manual.length} registros manuais lidos)`;
    $("csv").disabled=false;
  }catch(e){console.error(e);$("st").textContent=" Erro: "+e.message}
  $("go").disabled=false;
};

$("csv").onclick=()=>{
  const h=["Pessoa","Nível","Ingresso","Ano pub.","Título","Tipo","Veículo","DOI/Link","Fonte"];
  const t=[h,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));
  a.download="publicacoes-laboratorio.csv";a.click();
};
</script>
</body>
</html>
